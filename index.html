<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Monitoreo - Mapbox</title>

    <!-- Librerías de Mapbox GL JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />

    <!-- Librerías de Firebase (Versión 8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Turf.js para los cálculos matemáticos de la geocerca -->
    <script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script>

    <style>
        /* Ajustes de diseño nativo (Flotante) */
        body { margin: 0; padding: 0; height: 100vh; width: 100vw; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; position: relative; background-color: #f4f4f9; }
        aside { position: absolute; height: 100%; top: 0; left: 0; width: 320px; background-color: #222b36; color: #ffffff; display: flex; flex-direction: column; box-shadow: 2px 0 8px rgba(0,0,0,0.3); z-index: 10; transition: transform 0.3s ease-in-out; }
        aside.oculto { transform: translateX(-320px); }
        main { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        .btn-flotante { position: absolute; z-index: 20; background-color: #222b36; color: #5da9f6; border: 2px solid #5da9f6; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); transition: all 0.2s; }
        .btn-flotante:hover { background-color: #5da9f6; color: #1a222b; }
        #btn-toggle { top: 20px; left: 20px; font-size: 18px; padding: 8px 14px; }
        #btn-centrar { bottom: 40px; right: 20px; }
        
        /* Instrucción en pantalla */
        #instruccion { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20; background-color: rgba(34, 43, 54, 0.9); color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: bold; pointer-events: none; border: 1px solid #5da9f6; }

        header { background-color: #1a222b; padding: 20px; border-bottom: 1px solid #32404e; }
        header h1 { margin: 0; font-size: 18px; color: #5da9f6; text-transform: uppercase; letter-spacing: 1px; }
        section.datos-panel { padding: 20px; flex-grow: 1; overflow-y: auto; }
        
        #estado { display: block; margin-bottom: 25px; padding: 10px; border-radius: 4px; background-color: #3b2a2a; color: #ff6b6b; font-size: 13px; font-weight: bold; text-align: center; border: 1px solid #ff6b6b; }
        #estado.conectado { background-color: #213b2c; color: #4ade80; border: 1px solid #4ade80; }
        
        .tarjeta-info { background-color: #2c3743; padding: 15px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #5da9f6; }
        .tarjeta-info h3 { margin: 0 0 8px 0; font-size: 12px; color: #90a4ae; text-transform: uppercase; }
        .tarjeta-info p { margin: 4px 0; font-size: 15px; font-family: monospace; }
        #mapa { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <main>
        <div id="instruccion">Haz clic derecho en el mapa para asignar la escuela</div>
        <button id="btn-toggle" class="btn-flotante">☰</button>
        <div id="mapa"></div>
        <button id="btn-centrar" class="btn-flotante">Centrar Ubicación</button>
    </main>

    <aside id="panel-lateral">
        <header>
            <h1>Control Parental</h1>
        </header>
        <section class="datos-panel">
            <span id="estado">Esperando conexión...</span>
            <div class="tarjeta-info">
                <h3>Última Actualización</h3>
                <p>Fecha: <span id="fecha-txt">--/--/----</span></p>
                <p>Hora: <span id="hora-txt">--:--:--</span></p>
            </div>
            <div class="tarjeta-info">
                <h3>Coordenadas Actuales</h3>
                <p>Lat: <span id="lat-txt">--.------</span></p>
                <p>Lng: <span id="lng-txt">--.------</span></p>
            </div>
        </section>
    </aside>

    <script>
        // 1. CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAfc4xMCc3jEmGsgFWv_to2mkTAX_WIH3c",
            authDomain: "rastreo-familiar-4e8b4.firebaseapp.com",
            databaseURL: "https://rastreo-familiar-4e8b4-default-rtdb.firebaseio.com",
            projectId: "rastreo-familiar-4e8b4",
            storageBucket: "rastreo-familiar-4e8b4.firebasestorage.app",
            messagingSenderId: "122524876614",
            appId: "1:122524876614:web:e3201a8d13341e7577af47"
        };
        firebase.initializeApp(firebaseConfig);
        const baseDeDatos = firebase.database();
        const refEstudiante = baseDeDatos.ref('rastreo/estudiante');
        const refGeocerca = baseDeDatos.ref('rastreo/geocerca'); // NUEVO NODO PARA LA ESCUELA

        // 2. SISTEMA DE AUDIO (Alarma de advertencia)
        const alarmaSonora = new Audio('https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg');
        alarmaSonora.loop = true;
        let alarmaActivada = false;

        // 3. CONFIGURACIÓN DE MAPBOX
        mapboxgl.accessToken = 'pk.eyJ1IjoiZ29yZG9nYXRvNDAwIiwiYSI6ImNtc3huMm9vbzA0b2szNXBwcXp1c3JleGcifQ.I1nn6YTXVD8_0EDEUeO5_Q'; 
        
        const mapa = new mapboxgl.Map({
            container: 'mapa',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [-68.1641599, -16.5056737],
            zoom: 15
        });

        mapa.addControl(new mapboxgl.NavigationControl(), 'top-right');
        const popup = new mapboxgl.Popup({ offset: 25 });
        const marcador = new mapboxgl.Marker({ color: "#e74c3c" }).setLngLat([-68.1641599, -16.5056737]).setPopup(popup).addTo(mapa);

        let coordenadasTrayecto = [];
        let ultimaUbicacion = [-68.1641599, -16.5056737]; 

        // VARIABLES DINÁMICAS DE LA GEOCERCA
        let geocercaCentro = [-68.1641599, -16.5056737]; 
        const geocercaRadioKm = 0.2; // 200 metros a la redonda de la escuela
        const opcionesTurf = { steps: 64, units: 'kilometers' };
        let circuloGeocerca = turf.circle(geocercaCentro, geocercaRadioKm, opcionesTurf);

        mapa.on('load', () => {
            // Capa de Trayectoria
            mapa.addSource('ruta-tracker', {
                'type': 'geojson',
                'data': { 'type': 'Feature', 'properties': {}, 'geometry': { 'type': 'LineString', 'coordinates': coordenadasTrayecto } }
            });
            mapa.addLayer({
                'id': 'linea-ruta', 'type': 'line', 'source': 'ruta-tracker',
                'layout': { 'line-join': 'round', 'line-cap': 'round' },
                'paint': { 'line-color': '#e74c3c', 'line-width': 4, 'line-opacity': 0.7 }
            });

            // Capa de Geocerca
            mapa.addSource('fuente-geocerca', { 'type': 'geojson', 'data': circuloGeocerca });
            mapa.addLayer({
                'id': 'capa-geocerca-relleno', 'type': 'fill', 'source': 'fuente-geocerca',
                'paint': { 'fill-color': '#5da9f6', 'fill-opacity': 0.3 } // Cambié el color a azul para diferenciar la escuela
            });
            mapa.addLayer({
                'id': 'capa-geocerca-borde', 'type': 'line', 'source': 'fuente-geocerca',
                'paint': { 'line-color': '#5da9f6', 'line-width': 2 }
            });
        });

        // 4. NUEVO: ESCUCHAR CAMBIOS EN LA UBICACIÓN DE LA ESCUELA DESDE FIREBASE
        refGeocerca.on('value', (snapshot) => {
            const datosGeocerca = snapshot.val();
            if (datosGeocerca) {
                geocercaCentro = [datosGeocerca.lng, datosGeocerca.lat];
                circuloGeocerca = turf.circle(geocercaCentro, geocercaRadioKm, opcionesTurf);
                
                // Actualizar el mapa visualmente si la capa ya existe
                if (mapa.getSource('fuente-geocerca')) {
                    mapa.getSource('fuente-geocerca').setData(circuloGeocerca);
                }
            }
        });

        // 5. NUEVO: ASIGNAR NUEVA GEOCERCA AL HACER CLIC DERECHO
        mapa.on('contextmenu', (e) => {
            const confirmacion = confirm("¿Establecer este punto como la escuela / zona segura?");
            if (confirmacion) {
                // Guardar en Firebase
                refGeocerca.set({
                    lat: e.lngLat.lat,
                    lng: e.lngLat.lng
                }).then(() => {
                    alert("Zona segura actualizada con éxito.");
                }).catch((error) => {
                    console.error("Error al actualizar zona segura:", error);
                });
            }
        });

        // 6. ESCUCHA DE LA UBICACIÓN DEL ESTUDIANTE Y ALARMA
        refEstudiante.on('value', (snapshot) => {
            const datos = snapshot.val();

            if (datos) {
                const lat = datos.latitud;
                const lng = datos.longitud;
                const nuevaCoordenada = [lng, lat];
                
                document.getElementById('fecha-txt').innerText = datos.fecha;
                document.getElementById('hora-txt').innerText = datos.hora;
                document.getElementById('lat-txt').innerText = lat;
                document.getElementById('lng-txt').innerText = lng;

                ultimaUbicacion = nuevaCoordenada;
                coordenadasTrayecto.push(nuevaCoordenada);

                // --- EVALUACIÓN DE LA GEOCERCA ---
                const puntoActual = turf.point(nuevaCoordenada);
                const estaDentro = turf.booleanPointInPolygon(puntoActual, circuloGeocerca);
                const estadoUI = document.getElementById('estado');

                if (!estaDentro) {
                    estadoUI.innerText = "¡ALERTA! Fuera de la escuela";
                    estadoUI.style.backgroundColor = "#8b0000";
                    estadoUI.style.color = "#ffffff";
                    estadoUI.style.border = "1px solid #ff0000";
                    
                    // Disparar alarma sonora si no está sonando
                    if (!alarmaActivada) {
                        alarmaSonora.play().catch(e => console.log("El navegador requiere que hagas clic en la pantalla antes de reproducir audio."));
                        alarmaActivada = true;
                    }
                } else {
                    estadoUI.innerText = "Seguro - Dentro de la escuela";
                    estadoUI.style.backgroundColor = "#213b2c";
                    estadoUI.style.color = "#4ade80";
                    estadoUI.style.border = "1px solid #4ade80";

                    // Apagar la alarma si regresó a la zona segura
                    if (alarmaActivada) {
                        alarmaSonora.pause();
                        alarmaSonora.currentTime = 0;
                        alarmaActivada = false;
                    }
                }

                if (mapa.getSource('ruta-tracker')) {
                    mapa.getSource('ruta-tracker').setData({
                        'type': 'Feature',
                        'properties': {},
                        'geometry': { 'type': 'LineString', 'coordinates': coordenadasTrayecto }
                    });
                }

                marcador.setLngLat(nuevaCoordenada);
                marcador.getPopup().setHTML(`<b>Estudiante</b><br>Capturado: ${datos.hora}`);
                mapa.flyTo({ center: nuevaCoordenada, speed: 1.2, zoom: 15.5 });
            }
        });

        // BOTONES DE INTERFAZ
        document.getElementById('btn-toggle').addEventListener('click', () => {
            document.getElementById('panel-lateral').classList.toggle('oculto');
            setTimeout(() => { mapa.resize(); }, 300);
        });

        document.getElementById('btn-centrar').addEventListener('click', () => {
            mapa.flyTo({ center: ultimaUbicacion, zoom: 16, speed: 1.5 });
        });
    </script>
</body>
</html>
