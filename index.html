<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Monitoreo - Gestor de Dispositivos</title>

    <!-- Librerías de Mapbox GL JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    
    <!-- Librería de Mapbox Draw para dibujar polígonos -->
    <script src='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.js'></script>
    <link rel='stylesheet' href='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.css' type='text/css' />

    <!-- Librerías de Firebase (Versión 8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Turf.js -->
    <script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script>

    <style>
        body { margin: 0; padding: 0; height: 100vh; width: 100vw; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; position: relative; background-color: #f4f4f9; }
        
        aside { position: absolute; height: 100%; top: 0; left: 0; width: 350px; background-color: #222b36; color: #ffffff; display: flex; flex-direction: column; box-shadow: 2px 0 8px rgba(0,0,0,0.3); z-index: 10; transition: transform 0.3s ease-in-out; }
        aside.oculto { transform: translateX(-350px); }
        main { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        .btn-flotante { position: absolute; z-index: 20; background-color: #222b36; color: #5da9f6; border: 2px solid #5da9f6; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); transition: all 0.2s; }
        .btn-flotante:hover { background-color: #5da9f6; color: #1a222b; }
        #btn-toggle { top: 20px; left: 20px; font-size: 18px; padding: 8px 14px; }
        
        #btn-guardar-zona { bottom: 40px; right: 20px; background-color: #4ade80; color: #1a222b; border-color: #4ade80; display: none; }
        #btn-guardar-zona:hover { background-color: #213b2c; color: #4ade80; }

        header { background-color: #1a222b; padding: 20px; border-bottom: 1px solid #32404e; }
        header h1 { margin: 0; font-size: 18px; color: #5da9f6; text-transform: uppercase; letter-spacing: 1px; }
        
        section.datos-panel { padding: 20px; flex-grow: 1; overflow-y: auto; }
        
        /* Estilos de las tarjetas del Gestor de Dispositivos */
        .tarjeta-dispositivo { background-color: #2c3743; padding: 15px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #5da9f6; position: relative; }
        .tarjeta-dispositivo h3 { margin: 0 0 8px 0; font-size: 14px; color: #ffffff; display: flex; justify-content: space-between; align-items: center;}
        .tarjeta-dispositivo p { margin: 4px 0; font-size: 12px; color: #90a4ae; font-family: monospace; }
        
        .estado-chip { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .estado-seguro { background-color: #213b2c; color: #4ade80; border: 1px solid #4ade80; }
        .estado-peligro { background-color: #3b2a2a; color: #ff6b6b; border: 1px solid #ff6b6b; }
        .estado-sinzona { background-color: #32404e; color: #90a4ae; border: 1px solid #90a4ae; }

        .botones-accion { display: flex; gap: 8px; margin-top: 12px; }
        .btn-accion { flex: 1; padding: 8px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-centrar { background-color: #32404e; color: #5da9f6; border: 1px solid #5da9f6; }
        .btn-centrar:hover { background-color: #5da9f6; color: #1a222b; }
        .btn-editar { background-color: #e74c3c; color: white; }
        .btn-editar:hover { background-color: #c0392b; }

        #mapa { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .instruccion-edicion { display: none; background: #e74c3c; color: white; padding: 10px; text-align: center; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <main>
        <button id="btn-toggle" class="btn-flotante">☰</button>
        <div id="mapa"></div>
        <button id="btn-guardar-zona" class="btn-flotante">💾 Guardar Nueva Geocerca</button>
    </main>

    <aside id="panel-lateral">
        <header>
            <h1>Gestor de Dispositivos</h1>
        </header>
        <div id="mensaje-edicion" class="instruccion-edicion">
            Modo Edición: Dibuja un polígono (Máximo 8 puntos)
        </div>
        <section class="datos-panel" id="lista-dispositivos">
            <!-- Las tarjetas de dispositivos se inyectarán aquí con JavaScript -->
            <p style="color: #90a4ae; font-size: 13px; text-align: center;">Esperando conexión de dispositivos...</p>
        </section>
    </aside>

    <script>
        // 1. CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAfc4xMCc3jEmGsgFWv_to2mkTAX_WIH3c",
            authDomain: "rastreo-familiar-4e8b4.firebaseapp.com",
            databaseURL: "https://rastreo-familiar-4e8b4-default-rtdb.firebaseio.com",
            projectId: "rastreo-familiar-4e8b4",
            storageBucket: "rastreo-familiar-4e8b4.firebasestorage.app",
            messagingSenderId: "122524876614",
            appId: "1:122524876614:web:e3201a8d13341e7577af47"
        };
        firebase.initializeApp(firebaseConfig);
        const baseDeDatos = firebase.database();
        
        // NUEVA ESTRUCTURA: Escuchamos todo el nodo de "dispositivos"
        const refDispositivos = baseDeDatos.ref('rastreo/dispositivos');

        // 2. SISTEMA DE AUDIO
        const alarmaSonora = new Audio('https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg');
        alarmaSonora.loop = true;
        let alarmaSonando = false;

        // 3. CONFIGURACIÓN DE MAPBOX Y MAPBOX DRAW
        mapboxgl.accessToken = 'pk.eyJ1IjoiZ29yZG9nYXRvNDAwIiwiYSI6ImNtc3huMm9vbzA0b2szNXBwcXp1c3JleGcifQ.I1nn6YTXVD8_0EDEUeO5_Q'; 
        
        const mapa = new mapboxgl.Map({
            container: 'mapa',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [-68.1641599, -16.5056737],
            zoom: 15
        });

        // Inicializamos Mapbox Draw para polígonos
        const draw = new MapboxDraw({
            displayControlsDefault: false,
            controls: { polygon: true, trash: true },
            defaultMode: 'simple_select'
        });
        mapa.addControl(draw, 'top-right');

        // Variables de estado local
        let marcadores = {}; // Guarda los objetos mapboxgl.Marker
        let dispositivoEnEdicion = null; // ID del dispositivo al que le estamos dibujando la zona

        // 4. LECTURA DE DISPOSITIVOS EN TIEMPO REAL
        refDispositivos.on('value', (snapshot) => {
            const dispositivos = snapshot.val();
            const contenedorLista = document.getElementById('lista-dispositivos');
            contenedorLista.innerHTML = ''; // Limpiamos lista
            
            let algunNinoEnPeligro = false;

            if (dispositivos) {
                Object.keys(dispositivos).forEach(id => {
                    const data = dispositivos[id];
                    if (!data.ubicacion) return; // Si no tiene ubicación aún, lo saltamos

                    const coordActual = [data.ubicacion.longitud, data.ubicacion.latitud];
                    
                    // A. GESTIÓN DEL MARCADOR EN EL MAPA
                    if (!marcadores[id]) {
                        // Creamos un nuevo marcador si no existe
                        marcadores[id] = new mapboxgl.Marker({ color: "#e74c3c" })
                            .setLngLat(coordActual)
                            .setPopup(new mapboxgl.Popup({ offset: 25 }).setText(data.nombre || 'Dispositivo ' + id))
                            .addTo(mapa);
                    } else {
                        // Actualizamos posición
                        marcadores[id].setLngLat(coordActual);
                    }

                    // B. LÓGICA DE GEOCERCA (POLÍGONO)
                    let estadoActual = "SIN ZONA ASIGNADA";
                    let claseEstado = "estado-sinzona";
                    let estaSeguro = true;

                    if (data.geocerca && data.geocerca.geometry) {
                        const puntoActual = turf.point(coordActual);
                        const poligonoZona = data.geocerca;

                        // Dibujar geocerca en el mapa si NO la estamos editando en este momento
                        dibujarGeocercaEstatica(id, poligonoZona);

                        // Verificamos si está dentro del polígono
                        const estaDentro = turf.booleanPointInPolygon(puntoActual, poligonoZona);
                        
                        if (estaDentro) {
                            estadoActual = "SEGURO - EN ZONA";
                            claseEstado = "estado-seguro";
                        } else {
                            estadoActual = "¡ALERTA! FUERA DE ZONA";
                            claseEstado = "estado-peligro";
                            estaSeguro = false;
                            algunNinoEnPeligro = true;
                        }
                    } else {
                        // Si no tiene geocerca borramos cualquier capa residual
                        borrarGeocercaEstatica(id);
                    }

                    // C. CREACIÓN DE TARJETA EN LA UI
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta-dispositivo';
                    tarjeta.innerHTML = `
                        <h3>${data.nombre || 'Hijo: ' + id.substring(0,6)} <span class="estado-chip ${claseEstado}">${estadoActual}</span></h3>
                        <p>Última act: ${data.ubicacion.hora || '--:--'} | ${data.ubicacion.fecha || '--/--'}</p>
                        <p>Lat: ${data.ubicacion.latitud}</p>
                        <p>Lng: ${data.ubicacion.longitud}</p>
                        <div class="botones-accion">
                            <button class="btn-accion btn-centrar" onclick="centrarDispositivo('${id}')">📍 Centrar</button>
                            <button class="btn-accion btn-editar" onclick="iniciarEdicionZona('${id}')">✏️ Editar Zona</button>
                        </div>
                    `;
                    contenedorLista.appendChild(tarjeta);
                });

                // Control del sonido de alarma general
                if (algunNinoEnPeligro && !alarmaSonando) {
                    alarmaSonora.play().catch(e => console.log("Se requiere clic para audio"));
                    alarmaSonando = true;
                } else if (!algunNinoEnPeligro && alarmaSonando) {
                    alarmaSonora.pause();
                    alarmaSonora.currentTime = 0;
                    alarmaSonando = false;
                }
            } else {
                contenedorLista.innerHTML = '<p style="color: #90a4ae; font-size: 13px; text-align: center;">No hay dispositivos registrados.</p>';
            }
        });

        // 5. FUNCIONES PARA RENDERIZAR GEOCERCAS ESTÁTICAS
        function dibujarGeocercaEstatica(id, geojsonPoly) {
            const sourceId = 'fuente-zona-' + id;
            const layerFillId = 'capa-relleno-' + id;
            const layerLineId = 'capa-linea-' + id;

            // Si está en edición por el plugin Draw, no dibujamos la estática para que no se superpongan
            if (dispositivoEnEdicion === id) return;

            if (mapa.getSource(sourceId)) {
                mapa.getSource(sourceId).setData(geojsonPoly);
            } else {
                mapa.addSource(sourceId, { 'type': 'geojson', 'data': geojsonPoly });
                mapa.addLayer({
                    'id': layerFillId, 'type': 'fill', 'source': sourceId,
                    'paint': { 'fill-color': '#5da9f6', 'fill-opacity': 0.3 }
                });
                mapa.addLayer({
                    'id': layerLineId, 'type': 'line', 'source': sourceId,
                    'paint': { 'line-color': '#5da9f6', 'line-width': 2 }
                });
            }
        }

        function borrarGeocercaEstatica(id) {
            if (mapa.getLayer('capa-relleno-' + id)) mapa.removeLayer('capa-relleno-' + id);
            if (mapa.getLayer('capa-linea-' + id)) mapa.removeLayer('capa-linea-' + id);
            if (mapa.getSource('fuente-zona-' + id)) mapa.removeSource('fuente-zona-' + id);
        }

        // 6. FUNCIONES DE BOTONES UI (Centrar)
        window.centrarDispositivo = function(id) {
            const marker = marcadores[id];
            if (marker) {
                mapa.flyTo({ center: marker.getLngLat(), zoom: 16, speed: 1.5 });
            }
        };

        // 7. LÓGICA DE DIBUJO DE POLÍGONOS (Máximo 8 puntos)
        window.iniciarEdicionZona = function(id) {
            dispositivoEnEdicion = id;
            draw.deleteAll(); // Limpiamos el canvas de dibujo
            borrarGeocercaEstatica(id); // Ocultamos la versión estática temporalmente
            
            document.getElementById('btn-guardar-zona').style.display = 'block';
            document.getElementById('mensaje-edicion').style.display = 'block';
            
            // Si ya tenía geocerca, la cargamos en el editor
            refDispositivos.child(id).child('geocerca').once('value').then(snap => {
                if (snap.exists()) {
                    draw.add(snap.val());
                }
            });

            // Centramos la cámara en el marcador para facilitar el dibujo
            centrarDispositivo(id);
            draw.changeMode('draw_polygon');
        };

        // RESTRICCIÓN DE 8 PUNTOS: Escuchamos los cambios del plugin Draw
        mapa.on('draw.create', validarPuntosGeocerca);
        mapa.on('draw.update', validarPuntosGeocerca);

        function validarPuntosGeocerca(e) {
            const feature = e.features[0];
            // En un polígono GeoJSON, el arreglo de coordenadas cierra en sí mismo, 
            // por lo tanto 8 vértices equivalen a 9 coordenadas (el punto 9 es idéntico al 1).
            const coords = feature.geometry.coordinates[0];
            
            if (coords.length > 9) {
                alert("Restricción del sistema: La geocerca solo puede tener un máximo de 8 puntos. Por favor redúcelos.");
                
                // Truncamos el arreglo de coordenadas para forzar los 8 puntos + 1 cierre
                const nuevasCoords = coords.slice(0, 8);
                nuevasCoords.push(nuevasCoords[0]); // Cerramos la figura
                
                feature.geometry.coordinates[0] = nuevasCoords;
                draw.add(feature); // Actualizamos la figura forzando el límite
            }
        }

        // GUARDAR GEOCERCA EN FIREBASE
        document.getElementById('btn-guardar-zona').addEventListener('click', () => {
            const datosDibujados = draw.getAll();
            if (datosDibujados.features.length === 0) {
                alert("No has dibujado ninguna zona.");
                return;
            }

            const poligono = datosDibujados.features[0]; // Tomamos el primer polígono
            
            if (dispositivoEnEdicion) {
                refDispositivos.child(dispositivoEnEdicion).child('geocerca').set(poligono)
                .then(() => {
                    alert("Geocerca personalizada guardada con éxito.");
                    document.getElementById('btn-guardar-zona').style.display = 'none';
                    document.getElementById('mensaje-edicion').style.display = 'none';
                    draw.deleteAll();
                    dispositivoEnEdicion = null; // Salimos del modo edición
                });
            }
        });

        // TOGGLE PANEL
        document.getElementById('btn-toggle').addEventListener('click', () => {
            document.getElementById('panel-lateral').classList.toggle('oculto');
            setTimeout(() => { mapa.resize(); }, 300);
        });
    </script>
</body>
</html>
